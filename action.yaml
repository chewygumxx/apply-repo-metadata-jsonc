name: Apply repository metadata (JSONC)
description: 
    Applies metadata to a repository according to :/.repo-metadata.jsonc
branding:
    icon:  list
    color: black

inputs:
    metadata_path:
        required: false
        default:  .repo-metadata.jsonc
    token:
        required: true

runs:
    using: composite
    steps:
        - name: Initialise Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: '1.4'

        - name: Install Dependencies
          shell: bash
          run: |
              bun install --production --frozen-lockfile --cwd "$GITHUB_ACTION_PATH"

        - name: Apply Metadata
          shell: bash
          env:
              GITHUB_API_URL:    ${{ github.api_url }}
              GITHUB_TOKEN:      ${{ inputs.token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              METADATA_PATH:     ${{ inputs.metadata_path }}
          run: |
              bun "$GITHUB_ACTION_PATH/run.js"
